name: Build CV

# Compile the LaTeX CV variants on every push that touches them and commit the
# refreshed PDFs back to the repo, so the latest main.pdf is always in git
# (per this repo's convention of keeping compiled PDFs under version control).

on:
  push:
    branches: [main]
    paths:
      - "cv/academic/**"
      - "cv/industry/**"
      - ".github/workflows/build-cv.yml"
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-cv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile LaTeX (academic + industry)
        uses: xu-cheng/latex-action@v3
        with:
          # Each variant is self-contained; compile each in its own folder so
          # biber finds the co-located publications.bib and main.pdf lands beside main.tex.
          work_in_root_file_dir: true
          root_file: |
            cv/academic/main.tex
            cv/industry/main.tex
          # latexmk drives pdflatex + biber automatically (biblatex backend=biber).
          latexmk_use_lualatex: false

      - name: Commit refreshed PDFs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cv/academic/main.pdf cv/industry/main.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
          else
            git commit -m "rebuild cv pdfs"
            git push
          fi
